sonar.projectKey=steadybit_extension-kit
sonar.organization=steadybit

sonar.sources=.
# extquery/internal/gen is the ANTLR-generated parser: it is checked in, regenerated by
# extquery/generate.sh, and verified against the grammar by CI. Findings there are not actionable —
# fixing one would be overwritten on the next regeneration.
sonar.exclusions=**/*_test.go,extquery/internal/gen/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/*_test.go

# Coverage is reported for the whole module, so the generated parser has to be excluded here too,
# or it drags the ratio down with code no test will ever target directly.
sonar.coverage.exclusions=extquery/internal/gen/**

sonar.go.coverage.reportPaths=coverage.out
