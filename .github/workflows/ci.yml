name: ci

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write # SonarQube Cloud login without a stored token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true

      - name: Audit
        run: |
          go mod download
          make audit

      # Secretless analysis: SonarQube Cloud exchanges the identity of this job for a token that is valid
      # for 30 minutes and for the project bound to this repository only. No token is stored.
      - name: SonarQube Cloud login
        id: sonar-auth
        if: github.ref_name == 'main'
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2 NOSONAR githubactions:S7637 - verified action creator
        with:
          export-env: false

      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@v8  # NOSONAR githubactions:S7637 - verified action creator
        if: github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ steps.sonar-auth.outputs.sonar-token }}

  # The generated query language parser is checked in, so it can go stale against the grammar it was
  # generated from. Regenerate and fail on a diff. (Whether the grammar itself still matches the
  # platform's is checked in the platform repository — see extquery/grammar/.)
  extquery-codegen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '^1.26.5'

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Regenerate parser
        run: ./extquery/generate.sh

      - name: Ensure the checked-in parser matches the grammar
        run: |
          if ! git diff --exit-code -- extquery/internal/gen; then
            echo "::error::extquery/internal/gen is stale. Run ./extquery/generate.sh and commit the result."
            exit 1
          fi

  build-windows:
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '^1.26.5'

      - name: Audit
        run: |
          go mod download
          make audit