##
# Reusable workflow for automated Claude Code PR reviews.
#
# Usage in an extension:
#
#   name: Claude Code Review
#   on:
#     pull_request:
#       branches: [main]
#       types: [opened, synchronize, ready_for_review, reopened]
#   jobs:
#     claude-review:
#       uses: steadybit/extension-kit/.github/workflows/reusable-claude-pr-review.yml@main
#       secrets: inherit

name: Claude Code Review (reusable)

on:
  workflow_call:

jobs:
  claude-review:
    # Drafts are skipped; ready_for_review starts the first review.
    if: github.actor != 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read

    steps:
      - name: Resolve Claude token for PR author
        id: resolve-token
        run: |
          case "${{ github.event.pull_request.user.login }}" in
            ReuDa)           echo "token_name=CLAUDE_CODE_TOKEN_DANIEL" >> "$GITHUB_OUTPUT" ;;
            joshiste)        echo "token_name=CLAUDE_CODE_TOKEN_JOHANNES" >> "$GITHUB_OUTPUT" ;;
            ManuelGerding)   echo "token_name=CLAUDE_CODE_TOKEN_MANUEL" >> "$GITHUB_OUTPUT" ;;
            achoimet)        echo "token_name=CLAUDE_CODE_TOKEN_ANTOINE" >> "$GITHUB_OUTPUT" ;;
            DuarteMCSilva)   echo "token_name=CLAUDE_CODE_TOKEN_DUARTE"  >> "$GITHUB_OUTPUT" ;;
            maria-eltsova)   echo "token_name=CLAUDE_CODE_TOKEN_MARIA"  >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::No Claude token configured for user '${{ github.event.pull_request.user.login }}'"
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The review is posted by github-actions[bot] (see github_token below). claude-code-action only
      # recognises its earlier comment when the author is the Claude GitHub App or a bot named
      # "claude", so use_sticky_comment adds a new comment on every push. Remove the earlier ones
      # here, so that a pull request keeps a single review summary.
      - name: Remove earlier review summaries
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | test("^(\\*\\*Claude |Claude Code is working)"))) | .id' |
          while read -r id; do
            gh api -X DELETE "repos/$REPO/issues/comments/$id"
          done

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1 # NOSONAR githubactions:S7637 - verified action creator
        with:
          claude_code_oauth_token: ${{ secrets[steps.resolve-token.outputs.token_name] }}
          # The workflow token, limited by the permissions above (contents read, pull requests write).
          # Without it the action swaps in a token of the Claude GitHub App, which can write to the
          # repository. A review reads text anyone can post on a public pull request, so it must not
          # hold a token that can change code.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          include_fix_links: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            ## Step 1: Reply to previously addressed review threads

            Before reviewing new changes, check whether any of your prior unresolved
            review comments have been addressed in the current HEAD.

            1. Fetch unresolved review threads on this PR using GraphQL:

               ```
               gh api graphql -f query='
                 query($owner:String!,$repo:String!,$number:Int!) {
                   repository(owner:$owner,name:$repo) {
                     pullRequest(number:$number) {
                       reviewThreads(first:100) {
                         nodes {
                           id isResolved isOutdated
                           comments(first:10) {
                             nodes { author{login} body path line originalLine diffHunk }
                           }
                         }
                       }
                     }
                   }
                 }' -F owner=<owner> -F repo=<repo> -F number=<number>
               ```

            2. For each thread that is NOT resolved AND was authored by the review bot
               (`github-actions[bot]`, or `claude[bot]` for older threads), inspect the referenced file/line at HEAD and
               determine whether the issue has been fixed.

            3. If the issue is fixed, post a short reply on the thread linking to the fixing commit:
               `Addressed in ${{ github.event.pull_request.head.sha }} — https://github.com/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}`
               (use `gh api` to POST a reply via
               `repos/{owner}/{repo}/pulls/{number}/comments/{comment_id}/replies`). Skip threads whose last comment
               is already such a reply.

            4. If the issue is NOT fixed, leave the thread alone.

            Do not try to resolve threads: the workflow token is not allowed to, so a maintainer resolves them.

            ## Step 2: Review new changes

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications: review against the "Security" section below, including what it says to report,
              to skip and how to rate severity. Tag such comments `[security: high|medium|low]`.
            - Performance considerations
            - Race conditions or concurrency issues
            - Obvious typos that affect correctness

            Do NOT comment on:
            - Style, formatting, or naming preferences
            - Missing tests or documentation
            - Refactoring suggestions
            - Things that were already present before this PR (except security issues the "Security" section says to
              report as pre-existing)
            - Things that were already covered by a comment in this PR and are still unresolved. You may note it in the summary, but keep it short.

            Note: The PR branch is already checked out in the current working directory. HEAD is GitHub's merge commit
            of the PR into the base branch. For the diff, use `gh pr diff`, or
            `git show --diff-merges=first-parent HEAD -- <path>` for single files; `git diff` and `git blame` are not
            available.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

            ## Security

            Extensions run inside the customer's infrastructure, often as root, in host namespaces or with
            cluster-wide RBAC, and hold credentials for the systems they integrate with. Report only findings with a
            concrete attack path, with severity, exploit scenario and fix.

            Who controls what:
            - The operator (Helm values, environment variables, config files) is trusted. An attack that needs
              operator configuration is not a finding.
            - The agent, as the caller of the extension's HTTP API, is trusted to command the extension. The API has
              no authentication unless the operator configures mTLS (`STEADYBIT_EXTENSION_TLS_CLIENT_CAS`); reaching
              the port is the boundary, by design. Don't report the missing authentication, but do report a change
              that widens who can reach the API or what an endpoint reveals.
            - Action parameters and uploaded files are typed by platform users, whose permissions end at their
              environments. They are untrusted input: an action must not let them run arbitrary commands or reach
              beyond the target in the request.
            - Everything read from monitored systems (cloud and Kubernetes APIs, labels, container and process names,
              observability APIs, HTTP responses) is untrusted data, and so are the target attributes built from it.

            Report:
            - a request or discovered value reaching a shell (`sh -c`, a command line built as a string), or used
              unvalidated as an argument of a host tool (iptables, tc, nsenter, kill, ...) where it can inject
              options, commands or rules;
            - an action that affects more than the target in the request: a selector that matches everything when a
              value is empty, a fallback to a broader scope, a resource the target attributes don't name;
            - a credential (cloud keys, API tokens, passwords, kubeconfigs) reaching anything but its own service:
              discovery attributes, action messages, errors, metrics and artifacts reach the platform, where tenant
              users see them, and logs go to wherever the customer ships the pod's output;
            - TLS verification to a third-party API disabled without an operator setting that asks for it;
            - a file name or path from a request that can escape the directory meant for it; a secret written to a
              file other users can read;
            - new privileges (capabilities, privileged mode, host namespaces or paths, RBAC verbs or resources) in a
              Dockerfile, chart or manifest that the change does not need;
            - a workflow change that runs untrusted PR content with secrets: `pull_request_target` with a PR checkout,
              or a free-text event field (title, body, `head.ref`, labels, comment bodies) interpolated into `run:`.
              Logins, numbers and SHAs are safe. These repositories are public, so anyone can open a pull request;
            - a pre-existing weakness from this list that the change touches or makes reachable, marked as
              pre-existing.

            Don't report: attacks needing operator, host-admin or cluster-admin access; what an action does to its
            target on purpose (killing processes, filling disks, dropping traffic, running an uploaded load-test
            script, calling the URL an HTTP check was given); missing hardening without an attack path; DoS and
            resource exhaustion; outdated dependencies (Trivy and Dependabot cover them); theoretical races.

            Severity:
            - high: exposes a credential, lets a request run arbitrary commands, or makes an action hit something the
              request does not name;
            - medium: the same behind a realistic precondition, such as write access to the labels or names of a
              discovered resource;
            - low: defence in depth with a concrete gap and a small fix.

            ## Large pull requests

            A big diff may be split across subagents (the `Agent` tool is available and inherits your tool
            allowlist). Run every subagent in the foreground and wait for its result: this is a one-shot run, so the
            moment you end your turn the process exits and background agents are killed with their findings - never
            end your turn with "waiting for agents". Post what you have found as soon as an area is done, and always
            post a summary comment before you stop - a finished run with an empty checklist is indistinguishable from
            a review that never happened. If a tool call is denied, do not retry it: continue with the tools you have
            and say in the summary what you could not do.

          # Agent: a large diff is reviewed as several subagent passes; without it the model retries the denied
          # fan-out until it gives up and posts nothing (observed on a 264-file platform PR). Subagents inherit this
          # allowlist. Read-only git: a reviewer looks at the diff per file and at history; the action fetches the
          # base branch itself. Allow rules match by prefix and don't check flags, and a review reads comments anyone
          # can post on a public pull request, so no git command may run a command, write a file or read one outside
          # the checkout: `git fetch --upload-pack=<cmd>` (or `--upl=`) runs one, `git diff` reads any two paths
          # given as arguments (no `--no-index` needed), `git blame --contents` (or `--cont`) reads any file, and
          # `--output` makes log/show write a file of chosen content. git log/show refuse paths outside the checkout.
          claude_args: |
            --model opus --effort high
            --disallowedTools "Bash(git * --output*)"
            --allowedTools "Agent,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api graphql:*),Bash(gh api repos/*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git rev-parse:*),Bash(git merge-base:*)"
