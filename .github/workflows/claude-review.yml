name: Claude Code Review
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Local path, so that a pull request changing the shared workflow is reviewed with its own version.
    uses: ./.github/workflows/reusable-claude-pr-review.yml
    secrets: inherit # NOSONAR
